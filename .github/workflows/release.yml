name: Build Release Zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build zip
        run: |
          EXTENSION_KEY=mailchimpsync_names
          TAG="${GITHUB_REF_NAME}"
          ZIP_NAME="${EXTENSION_KEY}-${TAG}.zip"
          git archive --format=zip --prefix="${EXTENSION_KEY}/" -o "${ZIP_NAME}" "${GITHUB_REF_NAME}"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
      - name: Upload to release
        # The org Actions policy only allows GitHub-owned actions, so the upload uses
        # the gh CLI preinstalled on the runner instead of a third-party action.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${ZIP_NAME}" --clobber
